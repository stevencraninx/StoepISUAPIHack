<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short Track Schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 🔹 Sticky Header -->
  <header class="header">
    <h1 id="page-title">World Tour #1 – Montreal</h1>
    <!-- button class="menu-toggle" id="menu-btn">☰</button -->
    <div class="auto-refresh-toggle">
      <label class="switch">
        <input type="checkbox" id="auto-refresh" >
        <span class="slider"></span>
      </label>
      <span class="label-text">Auto-refresh</span>
    </div>

    <button class="hamburger" id="hamburger-btn" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="menu" id="mobile-menu">
      <ul>
        <li><a href="?day=wt1_day1">Day 1</a></li>
        <li><a href="?day=wt1_day2">Day 2</a></li>
        <li><a href="?day=wt1_day3">Day 3</a></li>
        <li><a href="?day=wt1_day4">Day 4</a></li>
      </ul>
    </nav>

  </header>


  <!-- 🔹 Hoofdinhoud -->
  <div class="container">
    <ul id="schedule"></ul>
  </div>

  <script src="script.js"></script>
  <script>
    const menuBtn = document.getElementById("menu-btn");
    const menu = document.getElementById("dropdown-menu");
    const select = document.getElementById("day-select");

    menuBtn.addEventListener("click", () => {
      menu.classList.toggle("hidden");
      if (!menu.classList.contains("hidden")) {
        // Forceer focus & open select meteen
        select.focus();
        // Sommige browsers vereisen een kleine delay om te “openen”
        setTimeout(() => {
          select.size = 4; // toont alle opties direct (geen klik nodig)
        }, 100);
      } else {
        select.size = 0;
      }
    });

    // Sluit menu bij keuze
    select.addEventListener("change", () => {
      menu.classList.add("hidden");
      select.size = 0;
    });
  </script>
</body>
</html>
