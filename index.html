<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short Track Schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 🔹 Sticky Header -->
  <header class="header">
    <h1 id="page-title">World Tour #1 – Montreal</h1>

    <!-- ▶︎ HAMBURGER KNOP -->
    <button class="hamburger" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>

    <div class="auto-refresh-toggle">
      <label class="switch">
        <input type="checkbox" id="auto-refresh">
        <span class="slider"></span>
      </label>
      <span class="label-text">Auto-refresh</span>
    </div>
  </header>

  <!-- ▶︎ UITKLAP-MENU -->
  <nav class="menu" id="menu" aria-hidden="true">
    <ul>
      <li><a href="#" onclick="document.getElementById('menu-btn').click()">Close</a></li>
      <!-- Je kunt hier later extra items toevoegen -->
    </ul>
  </nav>

  <!-- 🔹 Hoofdinhoud -->
  <div class="container">
    <ul id="schedule"></ul>
  </div>

  <script src="script.js"></script>

  <!-- ✅ Enkel dit script behouden voor het menu -->
  <script>
    (function () {
      const btn  = document.getElementById('menu-btn');
      const menu = document.getElementById('menu');

      if (!btn || !menu) return;

      const closeMenu = () => {
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
        menu.classList.remove('open');
        menu.setAttribute('aria-hidden', 'true');
      };

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const willOpen = !btn.classList.contains('open');
        btn.classList.toggle('open', willOpen);
        btn.setAttribute('aria-expanded', String(willOpen));
        menu.classList.toggle('open', willOpen);
        menu.setAttribute('aria-hidden', String(!willOpen));
      });

      // Klik buiten menu sluit het
      document.addEventListener('click', (e) => {
        if (!menu.classList.contains('open')) return;
        if (!menu.contains(e.target) && e.target !== btn) closeMenu();
      });

      // Escape sluit het
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });
    })();
  </script>
</body>
</html>
